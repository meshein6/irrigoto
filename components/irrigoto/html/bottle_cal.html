<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bottle calibration &mdash; irrigoto</title>
<script>
(function(){
  try{var t=localStorage.getItem('irrigoto_theme');
    if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}
  fetch('/api/theme').then(function(r){return r.json();}).then(function(d){
    var t2=d.dark?'dark':'light';
    if(document.documentElement.dataset.theme!==t2){
      document.documentElement.dataset.theme=t2;
      try{localStorage.setItem('irrigoto_theme',t2);}catch(e){}}
  }).catch(function(){});
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root,:root[data-theme="dark"]{
  --bg:#060c10;--bg2:#0b1820;--bg3:#0f2030;
  --green:#00e87a;--green-dim:#0a3020;--green-glow:rgba(0,232,122,.22);
  --orange:#ff8c00;--text:#c8e0d4;--text-mid:#608070;--text-dim:#1e3828;
  --border:#0c2a1e;--btn:#0b1c28;--radius:12px;--radius-sm:8px;--red:#f87171;
}
:root[data-theme="light"]{
  --bg:#f7f9f8;--bg2:#ffffff;--bg3:#eef3f0;
  --green:#00913f;--green-dim:#cfeede;--green-glow:rgba(0,145,63,.18);
  --orange:#c95400;--text:#0e1a14;--text-mid:#5a7468;--text-dim:#cfdcd5;
  --border:#cee0d7;--btn:#f0f5f2;--red:#c43030;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;}
body{display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-bottom:24px;}
header{display:flex;align-items:center;gap:12px;padding:14px 20px 10px;
  border-bottom:1px solid var(--border);}
.back{color:var(--green);text-decoration:none;font-size:20px;line-height:1;}
.hdr-title{font-family:'Courier New',monospace;font-size:16px;font-weight:700;
  letter-spacing:.1em;color:var(--green);flex:1;}
main{padding:16px;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px;}
.sec-title{font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--text-mid);font-weight:500;}
.pump-num{font-family:'Courier New',monospace;font-size:11px;color:var(--text-mid);letter-spacing:.1em;}
.card{background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
.hint{font-size:11px;color:var(--text-mid);margin-top:4px;line-height:1.4;}
.row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:flex-end;}
.row > .col{flex:1;min-width:0;}
.col label,.lbl{display:block;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--text-mid);margin-bottom:4px;}
.days{display:flex;gap:6px;justify-content:space-between;}
.day{flex:1;text-align:center;font-size:11px;font-weight:600;
  padding:8px 0;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--btn);color:var(--text-mid);cursor:pointer;
  font-family:inherit;letter-spacing:.04em;}
.day.sel{background:var(--green-dim);border-color:#1a5035;color:var(--green);}
.num{position:relative;}
.num input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);font-size:14px;padding:8px 44px 8px 10px;width:100%;font-family:inherit;
  -moz-appearance:textfield;}
.num input:focus{outline:1px solid var(--green);}
.num input.rate{text-align:right;}
.num input.set{outline:1px solid var(--green);}
.num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.num u{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;
  color:var(--text-mid);text-decoration:none;}
.rate-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.rate-row .k{flex:1;font-size:13px;color:var(--text);}
.rate-row .k span{color:var(--text-mid);font-size:11px;}
.rate-row .num{flex:1;}
.btn{padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--btn);color:var(--text);font-size:14px;cursor:pointer;
  font-family:inherit;flex:1;text-align:center;}
.btn-primary{background:var(--green-dim);border-color:#1a5035;color:var(--green);font-weight:600;}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn.small{flex:0 0 auto;padding:8px 14px;font-size:13px;}
.btn.stop{color:var(--red);}
.live{font-family:'Courier New',monospace;font-size:12px;color:var(--text-mid);margin:8px 0 10px;min-height:16px;}
.live b{color:var(--green);font-weight:700;}
.eq{font-family:'Courier New',monospace;font-size:13px;color:var(--green);padding-bottom:9px;white-space:nowrap;}
.save-bar{display:flex;gap:10px;margin-top:8px;}
#save-status{font-size:12px;text-align:center;margin-top:8px;min-height:16px;}
#save-status.ok{color:var(--green);}
#save-status.err{color:var(--red);}
</style>
</head>
<body>
<header>
  <a class="back" href="/" title="Back">&larr;</a>
  <span class="hdr-title">BOTTLE CALIBRATION</span>
</header>
<main>
  <div class="hint" style="margin:0 2px 12px">Rates are only used to estimate mL per run. Enter them directly, or run a pump and type what it consumed.</div>
  <div class="days" id="tabs" style="margin-bottom:10px">
    <button class="day sel" data-b="1">Bottle 1</button>
    <button class="day" data-b="2">Bottle 2</button>
    <button class="day" data-b="3">Bottle 3</button>
  </div>
  <div id="panels"></div>
  <div class="save-bar">
    <button class="btn" onclick="load()">Discard</button>
    <button class="btn" onclick="fillDefaults()">Defaults</button>
    <button class="btn btn-primary" id="save-btn" onclick="save()">Save</button>
  </div>
  <div id="save-status"></div>
</main>

<script>
const SPEEDS = [100, 80, 60];
const SPEED_NAME = {100:'Full', 80:'Medium', 60:'Low'};
let rates = [[0,0,0],[0,0,0],[0,0,0]];   // [bottle-1][speed idx] as loaded from the device
let defaults = [0.30, 0.23, 0.17];         // built-in rates per speed idx (device sends its own)
let jogTimer = null;

// numVal: clamped read that leaves the field alone (so the user can clear it
// and retype). clampNum: same, but writes the clamped value back -- blur only.
function numVal(el, lo, hi){ let v = parseInt(el.value, 10); if (!(v >= lo)) v = lo; if (v > hi) v = hi; return v; }
function clampNum(el, lo, hi){ const v = numVal(el, lo, hi); el.value = v; return v; }
function panel(b){ return document.getElementById('panel' + b); }
function q(b, r){ return panel(b).querySelector('[data-r="' + r + '"]'); }
function speedOf(b){ return +panel(b).querySelector('[data-r="speed"] .sel').dataset.v; }

function buildPanels(){
  const host = document.getElementById('panels');
  host.innerHTML = '';
  for (let b = 1; b <= 3; b++) {
    const c = document.createElement('div');
    c.id = 'panel' + b;
    c.style.display = b === 1 ? '' : 'none';
    c.innerHTML =
      '<div class="sec-hdr"><span class="sec-title">Pump rate</span><span class="pump-num">PUMP ' + b + '</span></div>' +
      '<div class="card">' +
        SPEEDS.map(v =>
          '<div class="rate-row"><div class="k">' + SPEED_NAME[v] + ' <span>(' + v + ' %)</span></div>' +
          '<div class="num"><input class="rate" type="number" data-cal="' + v + '" step="0.01" min="0" max="100" placeholder="not set" inputmode="decimal"><u>mL/s</u></div></div>'
        ).join('') +
      '</div>' +
      '<div class="sec-hdr" style="margin-top:16px"><span class="sec-title">Measure</span></div>' +
      '<div class="card">' +
        '<div class="hint" style="margin:0 0 10px">Run the pump, then measure how much solution was consumed from the bottle. Weighing the bottle before and after on a kitchen scale is the most reliable way (1 g &asymp; 1 mL). Expect some leakage from the nozzle after the pump stops.</div>' +
        '<span class="lbl">Pump speed</span>' +
        '<div class="days" data-r="speed">' +
          '<button class="day" data-v="60">Low</button><button class="day" data-v="80">Medium</button><button class="day sel" data-v="100">Full</button>' +
        '</div>' +
        '<div class="row" style="margin:10px 0 0">' +
          '<div class="col"><label>Run for</label><div class="num"><input type="number" data-r="dur" value="30" min="1" max="120" step="1" inputmode="numeric"><u>s</u></div></div>' +
          '<button class="btn small" data-r="run">&#9654; Run</button>' +
        '</div>' +
        '<div class="live" data-r="live">Idle</div>' +
        '<div class="row" style="margin:0">' +
          '<div class="col"><label>Consumed</label><div class="num"><input type="number" data-r="ml" placeholder="0.0" step="0.1" min="0" inputmode="decimal"><u>mL</u></div></div>' +
          '<span class="eq" data-r="eq">= &mdash; mL/s</span>' +
          '<button class="btn small" data-r="use">Use for Full</button>' +
        '</div>' +
      '</div>';
    host.appendChild(c);
    wirePanel(b);
  }
}

function wirePanel(b){
  const eq = () => {
    const ml = parseFloat(q(b,'ml').value), d = numVal(q(b,'dur'), 1, 120);
    q(b,'eq').innerHTML = ml > 0 ? '= ' + (ml / d).toFixed(2) + ' mL/s' : '= &mdash; mL/s';
  };
  panel(b).querySelectorAll('[data-r="speed"] .day').forEach(btn => btn.addEventListener('click', () => {
    panel(b).querySelectorAll('[data-r="speed"] .day').forEach(x => x.classList.toggle('sel', x === btn));
    q(b,'use').textContent = 'Use for ' + SPEED_NAME[speedOf(b)];
  }));
  q(b,'ml').addEventListener('input', eq);
  q(b,'dur').addEventListener('input', eq);
  q(b,'dur').addEventListener('blur', () => { clampNum(q(b,'dur'), 1, 120); eq(); });
  q(b,'run').addEventListener('click', () => jog(b));
  q(b,'use').addEventListener('click', () => {
    const ml = parseFloat(q(b,'ml').value); if (!(ml > 0)) return;
    const el = panel(b).querySelector('[data-cal="' + speedOf(b) + '"]');
    el.value = (ml / clampNum(q(b,'dur'), 1, 120)).toFixed(2);
    el.classList.add('set'); setTimeout(() => el.classList.remove('set'), 1200);
  });
}

function showTab(b){
  document.querySelectorAll('#tabs .day').forEach(x => x.classList.toggle('sel', +x.dataset.b === b));
  for (let i = 1; i <= 3; i++) panel(i).style.display = i === b ? '' : 'none';
}
document.querySelectorAll('#tabs .day').forEach(btn => btn.addEventListener('click', () => showTab(+btn.dataset.b)));

// ── Device I/O ───────────────────────────────────────────────────────────────
async function load(){
  const st = document.getElementById('save-status');
  st.className = ''; st.textContent = '';
  try {
    const d = await fetch('/api/solution_cal', {cache:'no-store'}).then(r => r.json());
    rates = d.rates || rates;
    defaults = d.defaults || defaults;
    for (let b = 1; b <= 3; b++) SPEEDS.forEach((v, i) => {
      const el = panel(b).querySelector('[data-cal="' + v + '"]');
      el.value = rates[b-1][i] > 0 ? (+rates[b-1][i]).toFixed(2) : '';
    });
  } catch (e) {
    st.className = 'err'; st.textContent = 'Load failed: ' + (e.message || e);
  }
}

// Fill every field with the device's built-in rates; Save applies them.
function fillDefaults(){
  for (let b = 1; b <= 3; b++) SPEEDS.forEach((v, i) => {
    panel(b).querySelector('[data-cal="' + v + '"]').value = (+defaults[i]).toFixed(2);
  });
  const st = document.getElementById('save-status');
  st.className = ''; st.textContent = 'Default rates filled in. Press Save to keep them.';
}

// One POST per changed (bottle, speed); untouched rates are not re-sent.
async function save(){
  const btn = document.getElementById('save-btn'), st = document.getElementById('save-status');
  btn.disabled = true; btn.textContent = 'Saving…'; st.className = ''; st.textContent = '';
  try {
    let n = 0;
    for (let b = 1; b <= 3; b++) for (let i = 0; i < SPEEDS.length; i++) {
      const el = panel(b).querySelector('[data-cal="' + SPEEDS[i] + '"]');
      const v = el.value === '' ? 0 : parseFloat(el.value);
      if (!(v >= 0) || v > 100) throw new Error('Bottle ' + b + ' ' + SPEED_NAME[SPEEDS[i]] + ': rate must be 0–100 mL/s');
      if (Math.abs(v - (+rates[b-1][i] || 0)) < 0.0005) continue;
      const r = await fetch('/api/solution_cal', {method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:'bottle=' + b + '&speed=' + SPEEDS[i] + '&rate=' + v.toFixed(3)});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      rates = (await r.json()).rates || rates;
      n++;
    }
    st.className = 'ok'; st.textContent = n ? 'Saved ✓ ' + n + ' rate' + (n === 1 ? '' : 's') : 'Nothing changed';
  } catch (e) {
    st.className = 'err'; st.textContent = e.message || String(e);
  } finally {
    btn.disabled = false; btn.textContent = 'Save';
  }
}

async function jog(b){
  const run = q(b,'run'), live = q(b,'live');
  if (jogTimer) {   // running -> stop
    await fetch('/api/pump_jog', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'stop=1'}).catch(() => {});
    return;
  }
  const secs = clampNum(q(b,'dur'), 1, 120), speed = speedOf(b);
  try {
    const r = await fetch('/api/pump_jog', {method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'pump=' + b + '&speed=' + speed + '&s=' + secs});
    if (!r.ok) throw new Error(await r.text());
  } catch (e) {
    live.innerHTML = '<span style="color:var(--red)">' + (e.message || e) + '</span>';
    return;
  }
  run.innerHTML = '&#9632; Stop'; run.classList.add('stop');
  const poll = async () => {
    try {
      const d = await fetch('/api/pump_jog', {cache:'no-store'}).then(r => r.json());
      if (d.running) {
        live.innerHTML = 'Running <b>' + (d.elapsed_ms / 1000).toFixed(1) + ' s</b> of ' + secs + ' s at ' + SPEED_NAME[speed] + ' &middot; <b>' + Math.round(d.ma) + ' mA</b>';
        return;
      }
    } catch (e) {}
    clearInterval(jogTimer); jogTimer = null;
    run.innerHTML = '&#9654; Run'; run.classList.remove('stop');
    live.innerHTML = 'Ran up to <b>' + secs + ' s</b> at ' + SPEED_NAME[speed] + ' &middot; now measure the bottle';
  };
  jogTimer = setInterval(poll, 500);
}

buildPanels();
load();
</script>
</body>
</html>
